# pyproject.toml — metadatos del proyecto + config de tooling (ruff, pytest).
#
# Nota: las dependencias de RUNTIME de las Lambdas viven en backend/requirements.txt
# y ai/requirements.txt (es lo que se empaqueta en el zip). Aquí se centralizan
# los metadatos y las herramientas de desarrollo.

[project]
name = "newsnow"
version = "0.1.0"
description = "MVP de NewsNow: API REST + asistente de IA (resúmenes) sobre AWS serverless."
requires-python = ">=3.12"
dependencies = ["boto3>=1.34"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[tool.pytest.ini_options]
# los módulos de las Lambdas son scripts planos: los ponemos en el path
pythonpath = ["ai", "backend"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F errores y estilo, I imports, B bugbear, UP pyupgrade, BLE except desnudo
select = ["E", "F", "I", "B", "UP", "BLE"]
